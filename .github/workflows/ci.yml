name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.jsx|.agents/pm/*.ts|.agents/pm/*.tsx|.agents/pm/*.mts|.agents/pm/*.cts|.agents/pm/*.sh|.agents/pm/extensions/*) code=true ;;
                docs/*.mjs|docs/*.cjs|docs/*.js|docs/*.jsx|docs/*.ts|docs/*.tsx|docs/*.mts|docs/*.cts|docs/*.sh) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; see
          # https://github.com/unbraind/pm-cli/issues/921 and
          # https://github.com/unbraind/pm-cli/issues/922 for the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: npm run changelog:check

      - name: Build and verify committed output is current
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      # Packed tests execute installed artifacts under Bun, but do not exercise
      # Bun's package manager or bunx. Keep both smoke paths explicitly.
      - name: Bun and bunx smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          bun --version
          bun install --no-save
          bunx --bun --package @unbrained/pm-cli@2026.11.10 pm --version

  windows-prepare-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PM_TEST_DEPTH: quick
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.jsx|.agents/pm/*.ts|.agents/pm/*.tsx|.agents/pm/*.mts|.agents/pm/*.cts|.agents/pm/*.sh|.agents/pm/extensions/*) code=true ;;
                docs/*.mjs|docs/*.cjs|docs/*.js|docs/*.jsx|docs/*.ts|docs/*.tsx|docs/*.mts|docs/*.cts|docs/*.sh) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # npm ci exercises production prepare through cmd.exe.
      - name: Install dependencies and merge drivers
        run: npm ci

      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        shell: bash
        run: |
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers
          npm run changelog:check

      - name: Exercise the real Windows command parser
        if: steps.changes.outputs.code == 'true'
        run: node --test tests/windows-prepare.integration.ts

      - name: Verify Windows closeout npm launcher and behavioral revert
        if: steps.changes.outputs.code == 'true'
        run: node --test --test-concurrency=1 tests/windows-closeout.integration.ts tests/closeout-history.test.ts tests/closeout-spawn.test.ts tests/tool-config.test.ts
